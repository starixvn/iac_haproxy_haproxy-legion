backend legion_lap_betlist_api_KLPROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    timeout server 10m
    option httpchk GET /ping
    http-check expect status 200
    server-template lap_betlist_api_KLPROD_ 2 lap_betlist_api_KLPROD:5000 check resolvers docker init-addr none

