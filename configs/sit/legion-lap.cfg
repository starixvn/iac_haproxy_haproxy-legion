backend legion_lap_ext_SIT_1_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template lap_ext_SIT_1_ 2 lap_ext_SIT_1:5000 check resolvers docker init-addr none

