#####
backend legion_lap_cron_jobs_SIT_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /ping
    http-check expect status 200
    cookie serverid insert
    server-template lap_cron_jobs_SIT_ 2 lap_cron_jobs_SIT:5000 check resolvers docker init-addr none

#######internal
frontend lap_identity_server_SIT_fe
    bind *:7680
    mode  http
    option forwardfor
    use_backend legion_lap_identity_server_SIT_be 

frontend lap_identity_server_SIT_1_fe
    bind *:7681
    mode  http
    option forwardfor
    use_backend legion_lap_identity_server_SIT_1_be 

frontend legion_lap_report_api_SIT_fe
    bind *:7685
    mode  http
    option forwardfor
    use_backend legion_lap_report_api_SIT_be

frontend legion_lap_report_api_SIT_1_fe
    bind *:7686
    mode  http
    option forwardfor
    use_backend legion_lap_report_api_SIT_1_be

frontend legion_lap_report_client_app_SIT_fe
    bind *:7687
    mode  http
    option forwardfor
    use_backend legion_lap_report_client_app_SIT_be
