

backend legion_lap_bet_ticket_SIT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /ping
    http-check expect status 200
    server-template lap_bet_ticket_SIT_ 2 lap_bet_ticket_SIT:5000 check resolvers docker init-addr none

