backend legion_lap_report_client_app_SIT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    timeout server 10m
    option httpchk GET /whoami
    http-check expect status 200
    server-template lap_report_client_app_SIT_ 2 lap_report_client_app_SIT:5000 check resolvers docker init-addr none
