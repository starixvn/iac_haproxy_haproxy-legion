

backend legion_la_licenseebillingsystem_KLDR_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 201
    server-template la_licenseebillingsystem_KLDR_ 1 la_licenseebillingsystem_KLDR:5000 check resolvers docker init-addr none

backend legion_lap_analytics_api_KLDR_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    timeout server 10m
    option httpchk GET /health
    http-check expect status 200
    server-template lap_analytics_api_KLDR_ 1 lap_analytics_api_KLDR:5000 check resolvers docker init-addr none
