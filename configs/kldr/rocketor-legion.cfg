backend legion_12b_cronjobs_v2_KLDR_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template 12b_cronjobs_v2_KLDR_ 1 12b_cronjobs_v2_KLDR:5000 check resolvers docker init-addr none

