backend legion_AFF_12B_Job_Service_LOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template AFF_12B_Job_Service_LOCAL_ 1 AFF_12B_Job_Service_LOCAL:5000 check resolvers docker init-addr none

