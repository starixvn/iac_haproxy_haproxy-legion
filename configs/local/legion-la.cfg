backend sparta_la1_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server-template sparta_la1_LOCAL_1_ 1 10.18.200.202:7615 check
    server-template sparta_la1_LOCAL_2_ 1 10.18.200.209:7615 check

