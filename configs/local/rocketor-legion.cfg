

backend legion_n88_ext_LOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template n88_ext_LOCAL_ 1 n88_ext_LOCAL:5000 check resolvers docker init-addr none

