backend LAP_LOGGING_be
    option httpchk GET /whoami.aspx
    http-check expect status 404
    server 10.2.190.88_tcp_7623 10.2.190.88:7623 check 
    server 10.2.190.89_tcp_7623 10.2.190.89:7623 check

backend LAP_LGAPI_be
    option httpchk GET /whoami.aspx
    http-check expect status 200
    server 10.2.190.88_tcp_7627 10.2.190.88:7627 check 
    server 10.2.190.89_tcp_7627 10.2.190.89:7627 check

