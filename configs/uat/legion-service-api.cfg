# frontend legion_lap_identity_server_UAT_fe
#     bind *:7680
#     timeout http-keep-alive 60s
#     use_backend legion_lap_identity_server_UAT_be

backend legion_lap_identity_server_UAT_be
    timeout http-keep-alive 60s
    option httpchk GET /ping
    http-check expect status 200
    cookie serverid insert
    server-template lap_identity_server_UAT_ 2 lap_identity_server_UAT:5000 check resolvers docker init-addr none

