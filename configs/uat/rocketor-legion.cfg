

backend legion_n88_ext_UAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template n88_ext_UAT_ 1 n88_ext_UAT:5000 check resolvers docker init-addr none

