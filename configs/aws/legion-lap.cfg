frontend legion_lap_identity_server_AWS_fe
    bind *:7680
    mode tcp
    option tcp-check
    option tcplog
    use_backend legion_lap_identity_server_AWS_be

backend legion_lap_identity_server_AWS_be
    timeout server 10m
    server-template lap_identity_server_AWS_ 2 lap_identity_server_AWS:5000 check resolvers docker init-addr none

