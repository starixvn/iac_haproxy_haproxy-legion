backend legion_lap_analytics_api_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /ping
    http-check expect status 200
    cookie serverid insert
    server-template lap_analytics_api_AWS_ 2 lap_analytics_api_AWS:5000 check resolvers docker init-addr none

