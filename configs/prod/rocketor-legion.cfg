

backend legion_n88_ext_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template n88_ext_PROD_ 1 n88_ext_PROD:5000 check resolvers docker init-addr none

backend legion_aff_yb_cronjob_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /ping
    http-check expect status 200
    server-template aff_yb_cronjob_PROD_ 1 aff_yb_cronjob_PROD:5000 check resolvers docker init-addr none
