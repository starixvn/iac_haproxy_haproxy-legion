frontend legion_lap_report_api_PROD_fe
    bind *:8003
    mode tcp
    option tcp-check
    option tcplog
    #mode http
    #timeout http-keep-alive 2m
    use_backend legion_lap_report_api_PROD_be

backend legion_lap_report_api_PROD_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template lap_report_api_PROD_ 2 lap_report_api_PROD:5000 check resolvers docker init-addr none

