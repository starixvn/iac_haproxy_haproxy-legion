backend legion_lap_player_admin_PROD_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /ping
    http-check expect status 200
    #cookie serverid insert
    server-template lap_player_admin_PROD_ 2 lap_player_admin_PROD:5000 check resolvers docker init-addr none

